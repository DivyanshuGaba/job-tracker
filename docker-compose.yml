x-backend-env: &backend-env
  DB_HOST: db
  DB_NAME: jobtracker
  DB_USER: jobtracker
  DB_PASSWORD: local-dev-only
  SECRET_KEY: local-dev-only-not-a-real-secret
  ENVIRONMENT: local
  AUTO_CREATE_TABLES: "false"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: local-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
